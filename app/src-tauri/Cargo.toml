[package]
name = "gh-projects"
version = "0.1.0"
description = "GitHub project & worktree manager"
edition = "2021"

[lib]
name = "gh_projects_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "system-proxy"] }
keyring = { version = "3", default-features = false, features = ["windows-native"] }
trash = "5"
