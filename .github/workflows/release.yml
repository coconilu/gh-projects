name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "版本号升级方式（自动更新 CHANGELOG 并提交回 master）"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - none
  issues:
    types: [closed]

permissions:
  contents: write
  pull-requests: write # bump 步骤需要建 PR 并合并（master 受分支保护，bot 不能直推）

jobs:
  # 版本号 bump + 解析 release tag；构建和发布都以这里输出的 tag 为准
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # bump 需要收集上个 tag 以来的提交

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Bump version & changelog (via auto-merged PR)
        id: bump
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .github/scripts/bump-version.mjs "$BUMP"
          VERSION=$(node -p "require('./app/package.json').version")
          BRANCH="chore/release-v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add app/package.json app/src-tauri/tauri.conf.json CHANGELOG.md
          git commit -m "chore: release v$VERSION"
          git push -u origin "$BRANCH"
          gh pr create --title "chore: release v$VERSION" --body "自动版本号升级（release 工作流）" --base master --head "$BRANCH"
          # 分支保护未设必需检查时可直接合并；设了就回退到 --auto 等 CI 通过后自动合并
          if ! gh pr merge --squash --delete-branch "$BRANCH"; then
            gh pr merge --squash --auto --delete-branch "$BRANCH"
            echo "已开启 auto-merge，等待 CI 通过后自动合并…"
            for i in $(seq 1 60); do
              STATE=$(gh pr view "$BRANCH" --json state -q .state || true)
              [ "$STATE" = "MERGED" ] && break
              sleep 10
            done
            if [ "$STATE" != "MERGED" ]; then
              echo "PR 未在预期时间内合并（state=$STATE）"
              exit 1
            fi
          fi

      - name: Resolve release tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            TAG="v$(node -p "require('./app/package.json').version")-issue${{ github.event.issue.number }}"
          elif [ -n "${{ steps.bump.outputs.tag }}" ]; then
            TAG="${{ steps.bump.outputs.tag }}"
          else
            TAG="v$(node -p "require('./app/package.json').version")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # 双平台构建：Windows NSIS 安装包 + macOS DMG（未做 Apple 签名/公证）
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 构建必须基于 bump 合并后的 master，而不是触发事件的旧提交
          ref: master

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build desktop installer (Tauri)
        # createUpdaterArtifacts 只在发布构建时开启：它要求签名私钥，
        # 留在默认配置里会导致本地无密钥时 tauri build 失败
        shell: bash # 默认 pwsh 会吞掉 --config JSON 里的双引号
        working-directory: app
        run: pnpm exec tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
        env:
          # updater 签名私钥（minisign，与 Apple 签名无关），存于仓库 Secrets；对应公钥写死在 tauri.conf.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.exe.sig

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        # upload-artifact 对多路径取最小公共祖先作为根目录，会把 macos/ 与 dmg/ 变成两层子目录；
        # 先归拢到扁平的 staging 目录再上传，保证 publish 端的目录约定成立
        run: |
          mkdir -p release-staging
          cp app/src-tauri/target/release/bundle/macos/*.app.tar.gz* release-staging/
          cp app/src-tauri/target/release/bundle/dmg/*.dmg release-staging/

      - name: Upload macOS artifacts (artifact)
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release-staging/*

  # 汇总双平台产物，生成 updater manifest 并发布 Release
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: master

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist-release/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: dist-release/macos

      - name: Generate updater manifest (latest.json)
        run: node .github/scripts/gen-latest-json.mjs "${{ needs.version.outputs.tag }}" dist-release

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: GitGrove ${{ needs.version.outputs.tag }}
          # issue 触发的构建标记为 prerelease，避免抢占 releases/latest（updater 端点）
          prerelease: ${{ github.event_name == 'issues' }}
          files: |
            dist-release/windows/*.exe
            dist-release/macos/*.dmg
            dist-release/macos/*.app.tar.gz
            dist-release/latest.json
